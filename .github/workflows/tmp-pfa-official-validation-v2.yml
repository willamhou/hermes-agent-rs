name: Temporary Pet Fair Asia Official Validation V2

on:
  pull_request:
    paths:
      - tmp_tools/pfa_official_page_enrichment_v2.py.gz.b64
      - .github/workflows/tmp-pfa-official-validation-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Decode V2 validator
        shell: bash
        run: |
          base64 -d tmp_tools/pfa_official_page_enrichment_v2.py.gz.b64 | gzip -d > /tmp/pfa_v2.py
          python -m py_compile /tmp/pfa_v2.py
      - name: Download bilingual validation seed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p pfa_v2_seed
          gh run download 32704327290 \
            --repo "${GITHUB_REPOSITORY}" \
            --name pfa-2026-full-validation \
            --dir pfa_v2_seed
          find pfa_v2_seed -maxdepth 2 -type f -print
      - name: Crawl official company, brand and product pages
        env:
          PFA_V2_SEED_DIR: pfa_v2_seed
          PFA_V2_WORKERS: '20'
          PFA_V2_TIMEOUT: '25'
        run: python /tmp/pfa_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfa-official-validation-v2
          path: pfa_official_validation_v2
          if-no-files-found: warn
          retention-days: 2
