name: Temporary Guanlan Horizon Probe

on:
  pull_request:
    paths:
      - tmp_tools/guanlan_probe.py
      - .github/workflows/tmp-guanlan-horizon-probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Probe public account and article indexes
        run: python tmp_tools/guanlan_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guanlan-horizon-probe
          path: guanlan_probe
          if-no-files-found: warn
          retention-days: 2
