name: Temporary Guanlan Horizon Fast Probe

on:
  pull_request:
    paths:
      - tmp_tools/guanlan_fast_probe.py
      - .github/workflows/tmp-guanlan-fast-probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  fast-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python tmp_tools/guanlan_fast_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guanlan-horizon-fast-probe
          path: guanlan_fast_probe
          if-no-files-found: warn
          retention-days: 2
