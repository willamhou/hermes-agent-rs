name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p hermes-cli

  browser-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      - name: Show Chrome version
        run: ${{ steps.chrome.outputs.chrome-path }} --version

      - name: Run live browser cleanup tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          cargo test -p hermes-tools browser::tests -- --nocapture
          cargo test -p hermes-gateway reclaim_terminal_cleanup_resources_reclaims_live_browser_session_manifests -- --nocapture

  pfa-full-brand-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pet-supplies detail artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 32687177343 -R willamhou/hermes-agent-rs -n pfa-pet-supplies-with-brands -D pet_seed

      - name: Install enrichment dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Enrich every company from official Related brands pages
        run: python tmp_tools/pfa_enrich_full_brands.py

      - name: Upload final pet-supplies CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfa-pet-supplies-full-brands
          path: pfa_pet_supplies_full_brands
          if-no-files-found: warn
          retention-days: 2
