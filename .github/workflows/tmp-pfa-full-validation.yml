name: Temporary Pet Fair Asia Full Validation

on:
  pull_request:
    paths:
      - tmp_tools/pfa_full_validation.py.gz.b64
      - .github/workflows/tmp-pfa-full-validation.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  pfa-full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Decode validation script
        shell: bash
        run: |
          base64 -d tmp_tools/pfa_full_validation.py.gz.b64 | gzip -d > /tmp/pfa_full_validation.py
          python -m py_compile /tmp/pfa_full_validation.py

      - name: Download previous official-directory artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p pfa_seed/detail pfa_seed/full-brands
          gh run download 32687177343 \
            --repo "${GITHUB_REPOSITORY}" \
            --name pfa-pet-supplies-with-brands \
            --dir pfa_seed/detail
          gh run download 32687810068 \
            --repo "${GITHUB_REPOSITORY}" \
            --name pfa-pet-supplies-full-brands \
            --dir pfa_seed/full-brands
          find pfa_seed -maxdepth 3 -type f -print

      - name: Crawl bilingual official pages and validate brand relationships
        env:
          PFA_SEED_DIR: pfa_seed
          PFA_DETAIL_WORKERS: '18'
          PFA_BRAND_WORKERS: '16'
          PFA_WEBSITE_WORKERS: '20'
          PFA_TIMEOUT: '25'
        run: python /tmp/pfa_full_validation.py

      - name: Upload bilingual validation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfa-2026-full-validation
          path: pfa_full_validation
          if-no-files-found: warn
          retention-days: 2
