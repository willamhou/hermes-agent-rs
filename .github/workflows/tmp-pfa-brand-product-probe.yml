name: Temporary Pet Fair Asia Brand Product Probe

on:
  pull_request:
    paths:
      - tmp_tools/pfa_brand_product_probe.py
      - .github/workflows/tmp-pfa-brand-product-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python tmp_tools/pfa_brand_product_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfa-brand-product-probe
          path: pfa_brand_product_probe
          if-no-files-found: warn
          retention-days: 2
