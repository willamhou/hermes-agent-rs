name: Temporary Guanlan Public Recheck
on:
  push:
    branches: ['tmp/guanlan-horizon-links-20260829']
    paths: ['.github/workflows/tmp-guanlan-public-recheck.yml']
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Follow real source links and public index pagination
        run: python tmp_tools/guanlan_source_followup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guanlan-source-followup
          path: guanlan_source_followup
          retention-days: 2
